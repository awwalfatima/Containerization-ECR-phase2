
name: Zeetafin CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build -t $ECR_REGISTRY/xahra/zeetafin:backend-$IMAGE_TAG ./Zeetafin-ERP/Backend
          docker push $ECR_REGISTRY/xahra/zeetafin:backend-$IMAGE_TAG

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/xahra/zeetafin:frontend-$IMAGE_TAG ./Zeetafin-ERP/frontend
          docker push $ECR_REGISTRY/xahra/zeetafin:frontend-$IMAGE_TAG

      - name: Deploy to EC2 using SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          DEPLOY_SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -e

          mkdir -p /opt/zeetafin
          cd /opt/zeetafin

          if [ ! -f .env ]; then
            DB_PASSWORD=$(openssl rand -hex 24)
            JWT_SECRET=$(openssl rand -hex 32)
            printf "DB_USERNAME=postgres\nDB_PASSWORD=%s\nDB_NAME=zeetafin\nJWT_SECRET=%s\n" "$DB_PASSWORD" "$JWT_SECRET" > .env
            chmod 600 .env
          fi

          source .env

          docker network create zeetafin-network 2>/dev/null || true
          docker network connect zeetafin-network nginx 2>/dev/null || true

          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 865480028999.dkr.ecr.eu-west-1.amazonaws.com

          docker pull 865480028999.dkr.ecr.eu-west-1.amazonaws.com/xahra/zeetafin:backend-__IMAGE_TAG__
          docker pull 865480028999.dkr.ecr.eu-west-1.amazonaws.com/xahra/zeetafin:frontend-__IMAGE_TAG__

          if ! docker ps -a --format '{{.Names}}' | grep -qx zeetafin-db; then
            docker run -d --name zeetafin-db --restart unless-stopped --network zeetafin-network \
              -e POSTGRES_USER="$DB_USERNAME" \
              -e POSTGRES_PASSWORD="$DB_PASSWORD" \
              -e POSTGRES_DB="$DB_NAME" \
              -v zeetafin-postgres-data:/var/lib/postgresql/data \
              postgres:16-alpine
          fi

          for i in $(seq 1 30); do
            if docker exec zeetafin-db pg_isready -U "$DB_USERNAME" -d "$DB_NAME"; then
              break
            fi
            sleep 5
          done

          docker rm -f zeetafin-backend 2>/dev/null || true
          docker run -d --name zeetafin-backend --restart unless-stopped --network zeetafin-network \
            --env-file /opt/zeetafin/.env \
            -e DB_HOST=zeetafin-db -e DB_PORT=5432 \
            -e PORT=3001 -e NODE_ENV=production \
            -e DB_SYNC=true -e DB_LOGGING=false \
            865480028999.dkr.ecr.eu-west-1.amazonaws.com/xahra/zeetafin:backend-__IMAGE_TAG__

          docker rm -f zeetafin-frontend 2>/dev/null || true
          docker run -d --name zeetafin-frontend --restart unless-stopped --network zeetafin-network \
            865480028999.dkr.ecr.eu-west-1.amazonaws.com/xahra/zeetafin:frontend-__IMAGE_TAG__

          cat > /home/ubuntu/zeetafin-nginx.conf <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name _;

              location /api/ {
                  proxy_pass http://zeetafin-backend:3001;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                  proxy_pass http://zeetafin-frontend:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
          NGINX

          docker cp /home/ubuntu/zeetafin-nginx.conf nginx:/etc/nginx/conf.d/default.conf
          docker exec nginx nginx -t
          docker exec nginx nginx -s reload

          echo "Zeetafin deployment completed."
          REMOTE_SCRIPT
          )

          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__IMAGE_TAG__/$IMAGE_TAG}"
          PARAMETERS=$(jq -n --arg command "$DEPLOY_SCRIPT" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0033b245759c633df \
            --document-name AWS-RunShellScript \
            --comment "Deploy Zeetafin application" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0033b245759c633df \
              --query 'Status' --output text 2>/dev/null || echo Pending)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0033b245759c633df \
                --query 'StandardOutputContent' --output text
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0033b245759c633df \
                --query 'StandardErrorContent' --output text
              exit 1
            fi
          done

          echo "Deployment timed out."
          exit 1
